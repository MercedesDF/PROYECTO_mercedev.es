name: Build & Deploy (SSG Cloud)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'biblioteca/**'
      - 'public/**'
      - 'scripts/merci/**'
      - 'src/scss/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # QUÉ HACE: Enlaza este trabajo con tu Entorno de GitHub para extraer sus secretos específicos.
    environment: 'Droplet Producción mercedev-php'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute SSG Compilation (Build)
        # QUÉ HACE: Compila y sincroniza todas las páginas de la capa estática.
        # POR QUÉ: Extrae la carga de compilación de la máquina local; el VPS solo recibe archivos listos.
        run: |
          python3 scripts/merci/merci-publish.py
          python3 scripts/merci/merci-sync-pages.py

      - name: Deploy to Production (CloudPanel) via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        # QUÉ HACE: Inyecta la clave SSH y sincroniza la carpeta compilada al servidor.
        # POR QUÉ: Automatiza el paso a producción con `--delete` para mantener el servidor web higienizado.
        run: |
          if [ -z "$SERVER_IP" ] || [ -z "$SERVER_USER" ]; then
            echo "🚨 ERROR: Faltan secretos. Revisa SERVER_IP o SERVER_USER en GitHub Settings > Secrets."
            exit 1
          fi
          
          # Inicializar el agente SSH nativo
          eval $(ssh-agent -s)
          
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          echo "🕵️‍♂️ Auditando la llave inyectada..."
          if [ $(wc -l < ~/.ssh/id_ed25519) -lt 3 ]; then
            echo "🚨 ERROR CRÍTICO: La llave ha perdido los saltos de línea al pegarla en GitHub."
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "🚨 ERROR CRÍTICO: El formato de la llave es inválido. ¿Copiaste la llave pública en lugar de la privada, o dejaste espacios?"
            exit 1
          fi
          echo "✅ La llave tiene un formato criptográfico válido."
          
          # Cargar la llave auditada en la memoria del agente
          ssh-add ~/.ssh/id_ed25519
          
          # Añadir la firma del servidor y desplegar confiando en el agente
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" --delete public/ $SERVER_USER@$SERVER_IP:~/htdocs/mercedev.es/public/